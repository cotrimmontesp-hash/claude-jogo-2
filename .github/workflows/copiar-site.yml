name: Copiar jogo da Vercel
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/copiar-site.yml']
permissions:
  contents: write
jobs:
  copiar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p site
          curl -fsSL https://claude-jogo-2.vercel.app/ -o site/index.html
          grep -q "Chef Arena" site/index.html
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add site/index.html
          git commit -m "Copia do jogo publicado na Vercel" || echo "sem mudancas"
          git push
