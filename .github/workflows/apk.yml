name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Baixar o jogo da Vercel
        run: |
          mkdir -p www
          curl -fsSL https://claude-jogo-2.vercel.app/ -o www/index.html
          grep -q "Chef Arena" www/index.html
      - name: Preparar app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Chef Arena" com.claude.chefarena --web-dir www
          npx cap add android
          npx cap sync android
      - name: Compilar APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ChefArena.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chef Arena v${{ github.run_number }}
          files: ChefArena.apk
