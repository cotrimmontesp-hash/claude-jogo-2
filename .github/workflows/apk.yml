name: Gerar APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Baixar o jogo da Vercel (espera a versão deste commit ser publicada)
        run: |
          mkdir -p www
          want=$(sha1sum repo/site/jogo.html | cut -d' ' -f1)
          for i in $(seq 1 60); do
            curl -fsSL "https://claude-jogo-2.vercel.app/jogo.html?v=$RANDOM" -o www/index.html || true
            got=$(sha1sum www/index.html | cut -d' ' -f1)
            [ "$got" = "$want" ] && echo "versão publicada confere" && break
            echo "aguardando publicação ($i)"; sleep 10
          done
          [ "$got" = "$want" ] || cp repo/site/jogo.html www/index.html
          grep -q "btnCreate" www/index.html
      - name: Preparar app
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "Chef Arena" com.claude.chefarena --web-dir www
          npx cap add android
          npx cap sync android
          # tela sempre deitada e em tela cheia
          sed -i 's/android:name=".MainActivity"/android:name=".MainActivity" android:screenOrientation="sensorLandscape"/' android/app/src/main/AndroidManifest.xml
          grep -q sensorLandscape android/app/src/main/AndroidManifest.xml
          # permissão para vibrar
          grep -q android.permission.VIBRATE android/app/src/main/AndroidManifest.xml || sed -i 's#</manifest>#    <uses-permission android:name="android.permission.VIBRATE" />\n</manifest>#' android/app/src/main/AndroidManifest.xml
          grep -q android.permission.VIBRATE android/app/src/main/AndroidManifest.xml
          sed -i 's#<style name="AppTheme.NoActionBar" parent="Theme.AppCompat.DayNight.NoActionBar">#&\n        <item name="android:windowFullscreen">true</item>#' android/app/src/main/res/values/styles.xml || true
      - name: Compilar APK
        run: |
          cd android && chmod +x gradlew && ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../ChefArena.apk
      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Chef Arena v${{ github.run_number }}
          files: ChefArena.apk
